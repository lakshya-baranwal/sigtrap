<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGTRAP — Pause. Inspect. Understand.</title>
  <meta name="description" content="SIGTRAP is a personal interview knowledge debugger for developers preparing for systems, Linux, C++, networking, ML, and low-level engineering interviews." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─── HEADER ─── -->
  <header class="header" id="app-header">
    <div class="header-left">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="24" height="24" rx="6" fill="currentColor"/>
            <text x="14" y="19" text-anchor="middle" font-size="14" font-weight="700" font-family="monospace" fill="var(--bg)">N</text>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">SIGTRAP</span>
          <span class="brand-tagline">Pause. Inspect. Understand.</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div class="search-wrapper" id="search-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
          <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search questions..."
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="search-kbd">⌘K</kbd>
      </div>
      <div class="search-results" id="search-results" hidden></div>
    </div>

    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme" aria-label="Toggle light/dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.5"/>
          <line x1="9" y1="1" x2="9" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="15" x2="9" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="1" y1="9" x2="3" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="15" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="3.34" y1="3.34" x2="4.76" y2="4.76" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.24" y1="13.24" x2="14.66" y2="14.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="14.66" y1="3.34" x2="13.24" y2="4.76" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4.76" y1="13.24" x2="3.34" y2="14.66" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M15 11.5A7 7 0 0 1 6.5 3 7 7 0 1 0 15 11.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="random-btn" id="random-btn" title="Random Question">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <polygon points="7,1 13,5.5 13,8.5 7,13 1,8.5 1,5.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
          <circle cx="7" cy="7" r="1.5" fill="currentColor"/>
        </svg>
        <span>Random Question</span>
      </button>
    </div>
  </header>

  <!-- ─── MAIN LAYOUT ─── -->
  <div class="app-layout">

    <!-- ─── LEFT SIDEBAR ─── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <p class="sidebar-label">TOPICS</p>
        <nav class="topic-nav" id="topic-nav">
          <!-- Populated by JS -->
        </nav>
      </div>

      <div class="sidebar-footer">
        <p class="sidebar-label">REVISION STATUS</p>
        <div class="legend">
          <div class="legend-item">
            <span class="status-dot dot-none"></span>
            <span>Not Reviewed</span>
          </div>
          <div class="legend-item">
            <span class="status-dot dot-revision"></span>
            <span>Needs Revision</span>
          </div>
          <div class="legend-item">
            <span class="status-dot dot-mastered"></span>
            <span>Mastered</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ─── CENTER COLUMN ─── -->
    <main class="question-list-panel" id="question-list-panel">
      <div class="panel-header" id="panel-header">
        <span class="panel-title" id="panel-title">Select a topic</span>
        <span class="panel-count" id="panel-count"></span>
      </div>
      <div class="question-list" id="question-list">
        <!-- Populated by JS -->
      </div>
    </main>

    <!-- ─── RIGHT PANEL ─── -->
    <section class="answer-panel" id="answer-panel">
      <div class="answer-empty" id="answer-empty">
        <div class="empty-icon">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <rect x="3" y="16" width="6" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <rect x="31" y="16" width="6" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="10" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="3" fill="currentColor"/>
            <line x1="20" y1="4" x2="20" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="20" y1="31" x2="20" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="empty-title">Select a question</p>
        <p class="empty-subtitle">Choose a topic and question from the left to begin your inspection.</p>
      </div>
      <div class="answer-content" id="answer-content" hidden>
        <div class="answer-toolbar" id="answer-toolbar">
          <div class="answer-actions">
            <button class="action-btn" id="bookmark-btn" title="Bookmark">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M4 2h8a1 1 0 0 1 1 1v11l-5-3-5 3V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="action-btn" id="share-btn" title="Share">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="12" cy="3.5" r="2" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="4" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="12" cy="12.5" r="2" stroke="currentColor" stroke-width="1.2"/>
                <line x1="5.8" y1="7" x2="10.2" y2="4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                <line x1="5.8" y1="9" x2="10.2" y2="11.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="action-btn" id="more-btn" title="More options">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="4" cy="8" r="1.2" fill="currentColor"/>
                <circle cx="8" cy="8" r="1.2" fill="currentColor"/>
                <circle cx="12" cy="8" r="1.2" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="answer-body" id="answer-body"></div>
      </div>
    </section>
  </div>

  <!-- ─── FOOTER ─── -->
  <footer class="app-footer">
    <div class="footer-left">
      <span class="footer-code-icon">&lt;/&gt;</span>
      <span>Made with ♥ for learning</span>
    </div>
    <a href="https://github.com" class="footer-link" target="_blank" rel="noopener noreferrer" title="GitHub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
          1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
          1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
          1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
      </svg>
    </a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="app.js?v=4" defer></script>
</body>
</html>
